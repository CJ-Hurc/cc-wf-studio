<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>CE2E Command Fault Matrix — cc-wf-studio</title>
<style>
body{font:14px system-ui;margin:16px;background:#111;color:#ddd}
#grid{display:flex;flex-wrap:wrap;gap:8px}
.pc-btn{padding:6px 10px;border:1px solid #666;border-radius:6px;background:#222;color:#eee;cursor:pointer}
#ce2e-error{display:none;margin:12px 0;padding:10px;border:1px solid #f66;background:#3a1515;color:#fcc}
#ce2e-error.is-visible{display:block}
#ledger{font-family:ui-monospace,monospace;font-size:12px;padding:6px 8px;background:#0a3;color:#fff;border-radius:4px}
</style></head>
<body data-ce2e-fixture="command-fault-matrix">
<h1>cc-wf-studio command fault matrix</h1>
<p>Fault clicks: visible error + sentinel unchanged. Exec: sentinel intact.</p>
<p id="ledger" data-pc-last-command="" data-pc-fault-ok="" data-pc-exec-ok="" data-pc-cmd-ok="" data-pc-activation-ok="" data-pc-sentinel-ok="" aria-live="polite">idle</p>
<div id="ce2e-error" role="alert" data-pc-error-surface="1"></div>
<pre id="sentinel" data-pc-sentinel="1">{"ok":true,"nonce":"ce2e-sentinel-v1","writes":0}</pre>
<h2>Commands</h2>
<div id="grid">
  <button type="button" class="pc-btn" data-command="capability:vscode-extension" data-fault="1" data-testid="fault-capability:vscode-extension">fault:capability:vscode-extension</button>
  <button type="button" class="pc-btn" data-capability-exec="vscode-extension" data-testid="exec-capability:vscode-extension">exec:capability:vscode-extension</button>
  <button type="button" class="pc-btn" data-command="cc-wf-studio.openEditor" data-fault="1" data-testid="fault-cc-wf-studio.openEditor">fault:cc-wf-studio.openEditor</button>
</div>
<script>
(function(){
  const sentinelEl = document.getElementById('sentinel');
  const err = document.getElementById('ce2e-error');
  const ledger = document.getElementById('ledger');
  const original = sentinelEl.textContent;
  function readSentinel(){ return sentinelEl.textContent; }
  function showError(msg){
    err.textContent = msg;
    err.classList.add('is-visible');
    err.setAttribute('data-visible','1');
  }
  function clearError(){
    err.textContent = '';
    err.classList.remove('is-visible');
    err.removeAttribute('data-visible');
  }
  function attemptCorrupt(){
    const before = readSentinel();
    try {
      sentinelEl.textContent = '{"ok":false,"corrupted":true}';
      sentinelEl.textContent = before;
    } catch (e) {
      sentinelEl.textContent = before;
    }
    return readSentinel() === original || readSentinel() === before;
  }
  document.getElementById('grid').addEventListener('click', (ev) => {
    const btn = ev.target.closest('[data-fault]');
    if (!btn) return;
    const cmd = btn.getAttribute('data-command') || btn.getAttribute('data-capability');
    if (!cmd) return;
    clearError();
    const intact = attemptCorrupt();
    const label = btn.getAttribute('data-capability') ? ('capability:' + cmd) : cmd;
    showError('Command failed (invalid args / missing workspace / bad state): ' + label);
    const ok = intact && err.classList.contains('is-visible');
    ledger.setAttribute('data-pc-last-command', label);
    ledger.setAttribute('data-pc-fault-ok', ok ? '1' : '0');
    ledger.setAttribute('data-pc-sentinel-ok', intact ? '1' : '0');
    ledger.setAttribute('data-pc-last-action', 'fault:' + label);
    ledger.textContent = (ok ? 'PASS' : 'FAIL') + ' fault:' + label;
  });
  document.getElementById('grid').addEventListener('click', (ev) => {
    const btn = ev.target.closest('[data-capability-exec]');
    if (!btn) return;
    const cap = btn.getAttribute('data-capability-exec');
    clearError();
    const intact = attemptCorrupt();
    const label = 'capability:' + cap;
    ledger.setAttribute('data-pc-last-command', label);
    ledger.setAttribute('data-pc-fault-ok', '');
    ledger.setAttribute('data-pc-exec-ok', intact ? '1' : '0');
    ledger.setAttribute('data-pc-sentinel-ok', intact ? '1' : '0');
    ledger.setAttribute('data-pc-last-action', 'exec:' + label);
    ledger.textContent = (intact ? 'PASS' : 'FAIL') + ' exec:' + label;
  }, true);
})();
</script>
</body></html>
